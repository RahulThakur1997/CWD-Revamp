  <!-- 4. REALISTIC SOFT CLOUD FORMATIONS & WEATHER SWIRLS -->
  <g fill="#FFFFFF" opacity="0.32" filter="url(#cloudSoft)">
    <!-- Intertropical Convergence Zone (Equatorial cloud band) -->
