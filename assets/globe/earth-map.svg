    <!-- North Atlantic Weather Spiral -->
    <path d="M 768.0,256.0 Q 853.3,199.1 938.7,227.6 T 1052.4,182.0" stroke="#FFFFFF" stroke-width="34" fill="none"/>
    <ellipse cx="824.9" cy="238.9" rx="65" ry="35" transform="rotate(-20 800 240)"/>

    <!-- North Pacific Cloud Swirl -->
    <path d="M 113.8,273.1 Q 227.6,227.6 312.9,256.0" stroke="#FFFFFF" stroke-width="32" fill="none"/>

