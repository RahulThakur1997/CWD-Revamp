<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="sprintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="60%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#141E0A"/>
    </linearGradient>
    <radialGradient id="timerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6F24D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C6F24D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#sprintGrad)"/>
  <!-- Stopwatch / Rapid Delivery Geometry -->
  <circle cx="300" cy="420" r="160" fill="url(#timerGlow)"/>
  <circle cx="300" cy="420" r="130" fill="none" stroke="#27272A" stroke-width="6"/>
  <circle cx="300" cy="420" r="130" fill="none" stroke="#C6F24D" stroke-width="6" stroke-dasharray="816" stroke-dashoffset="200"/>
  <!-- 24h Text -->
  <text x="300" y="410" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="56" font-weight="900" text-anchor="middle">24H</text>
  <text x="300" y="455" fill="#C6F24D" font-family="monospace" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">RAPID SPRINT</text>
  <!-- Fast Speed streaks -->
  <line x1="160" y1="560" x2="440" y2="560" stroke="#3F3F46" stroke-width="2" stroke-dasharray="20,15"/>
  <line x1="200" y1="585" x2="400" y2="585" stroke="#C6F24D" stroke-width="2" stroke-dasharray="10,25"/>
</svg>