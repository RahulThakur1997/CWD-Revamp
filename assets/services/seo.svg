    <text x="42" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#059669">★ ★ ★ ★ ★ 4.9 (240+ reviews) &bull; Core Web Vitals: 99/100</text>
    
