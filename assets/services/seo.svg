  <rect width="600" height="500" fill="url(#seoBg)"/>
  
  <circle cx="450" cy="150" r="150" fill="rgba(167, 243, 208, 0.45)"/>
  <circle cx="150" cy="380" r="140" fill="rgba(191, 219, 254, 0.45)"/>

  <!-- Google Rank #1 Dominance Card Floating in Center -->
