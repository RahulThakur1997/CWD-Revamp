<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="60%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#1E1030"/>
    </linearGradient>
    <radialGradient id="aiPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#aiGrad)"/>
  <!-- Neural Voice Waveform Visual -->
  <circle cx="300" cy="400" r="170" fill="url(#aiPulse)"/>
  <!-- Waveform bars -->
  <g transform="translate(180, 360)">
    <rect x="0" y="20" width="8" height="40" rx="4" fill="#818CF8"/>
    <rect x="20" y="5" width="8" height="70" rx="4" fill="#A855F7"/>
    <rect x="40" y="-15" width="8" height="110" rx="4" fill="#C084FC"/>
    <rect x="60" y="-35" width="8" height="150" rx="4" fill="#C6F24D"/>
    <rect x="80" y="-10" width="8" height="100" rx="4" fill="#38BDF8"/>
    <rect x="100" y="-45" width="8" height="170" rx="4" fill="#C6F24D"/>
    <rect x="120" y="-20" width="8" height="120" rx="4" fill="#A855F7"/>
    <rect x="140" y="0" width="8" height="80" rx="4" fill="#818CF8"/>
    <rect x="160" y="15" width="8" height="50" rx="4" fill="#6366F1"/>
    <rect x="180" y="25" width="8" height="30" rx="4" fill="#4338CA"/>
